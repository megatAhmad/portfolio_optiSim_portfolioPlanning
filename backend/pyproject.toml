[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-optisim"
version = "0.1.0"
description = "AI-augmented multi-year portfolio optimization platform for energy and capital-intensive industries"
readme = "README.md"
license = "Proprietary"
requires-python = ">=3.11"
authors = [
    { name = "Portfolio OptiSim Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database / ORM
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.30.0",

    # Validation / Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Optimization
    "pyomo>=6.8.0",
    "highspy>=1.8.0",
    "scipy>=1.14.0",
    "cvxpy>=1.5.0",

    # Data Processing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.12.0",

    # Graph Analysis
    "networkx>=3.4.0",

    # ML / Surrogate Modeling
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",

    # Task Queue / Cache
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Excel Import
    "openpyxl>=3.1.5",

    # Logging
    "structlog>=24.4.0",

    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",

    # Linting / Formatting
    "ruff>=0.7.0",

    # Type Checking
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "sqlalchemy[mypy]>=2.0.35",

    # Load Testing
    "locust>=2.32.0",
]

# Commercial solvers (optional, require separate licenses)
commercial-solvers = [
    "gurobipy>=11.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# Ruff Configuration
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print (no print() in production)
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "ANN401",  # dynamically typed expressions (typing.Any)
    "S101",    # use of assert (allowed in tests)
    "B008",    # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "ANN",     # type annotations relaxed in tests
    "T20",     # print allowed in tests
]
"alembic/**/*.py" = [
    "ANN",     # type annotations relaxed in migrations
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --------------------------------------------------------------------------
# Mypy Configuration
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "pyomo.*",
    "highspy.*",
    "cvxpy.*",
    "networkx.*",
    "sklearn.*",
    "xgboost.*",
    "openpyxl.*",
    "locust.*",
    "polars.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# Pytest Configuration
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database and/or Redis)",
    "slow: Slow tests (optimization benchmarks, load tests)",
    "solver: Tests that require a specific solver to be installed",
]

# --------------------------------------------------------------------------
# Coverage Configuration
# --------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/tasks/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
